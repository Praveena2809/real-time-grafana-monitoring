apiVersion: 1

groups:
  - orgId: 1
    name: 'GrafanaOps Alert Group'
    folder: 'GrafanaOps'
    interval: 10s
    rules:
      - uid: 'high_error_rate_alert'
        title: 'High HTTP Error Rate'
        condition: 'C'
        data:
          - refId: 'A'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: 'prometheus'
            model:
              editorMode: 'code'
              expr: '(sum(rate(http_requests_total{status=~"5.."}[30s])) or vector(0)) / clamp_min(sum(rate(http_requests_total[30s])) or vector(0.001), 0.001) * 100'
              instant: true
              range: false
              refId: 'A'
          - refId: 'B'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: 'C'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: '$B > 5'
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: 'High HTTP 5xx Error Rate detected'
          description: 'HTTP 5xx error rate is above 5% threshold'
        labels:
          severity: critical

      - uid: 'high_latency_alert'
        title: 'High Response Latency'
        condition: 'C'
        data:
          - refId: 'A'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: 'prometheus'
            model:
              editorMode: 'code'
              expr: 'sum(rate(http_request_duration_seconds_sum{endpoint!="/metrics"}[30s])) / clamp_min(sum(rate(http_request_duration_seconds_count{endpoint!="/metrics"}[30s])), 0.001)'
              instant: true
              range: false
              refId: 'A'
          - refId: 'B'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: 'C'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: '$B > 1.0'
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: 'High Response Latency detected'
          description: 'Average response latency is above 1.0s threshold'
        labels:
          severity: warning

      - uid: 'high_cpu_alert'
        title: 'High CPU Usage'
        condition: 'C'
        data:
          - refId: 'A'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: 'prometheus'
            model:
              editorMode: 'code'
              expr: 'app_cpu_usage_percent'
              instant: true
              range: false
              refId: 'A'
          - refId: 'B'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: [75]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: 'C'
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: [75]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: '$B > 75'
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: 'High CPU usage detected'
          description: 'Application CPU usage has exceeded 75%'
        labels:
          severity: warning

global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi"
    metrics_path: "/metrics"
    scrape_interval: 2s
    scrape_timeout: 2s
    static_configs:
      - targets: ["app:8000"]
        labels:
          app: "fastapi-ecommerce"
          env: "production"
